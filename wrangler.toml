name = "api-v2"
main = "apiv2.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# D1 Database binding
# Replace database_id with your actual Cloudflare D1 Database ID to sync with dashboard
# [[d1_databases]]
# binding = "DB"
# database_name = "api-v2-db"
# database_id = "<your-d1-database-id>"

# KV Namespace binding (optional)
# [[kv_namespaces]]
# binding = "VIDARA_KV"
# id = "<your-kv-namespace-id>"

